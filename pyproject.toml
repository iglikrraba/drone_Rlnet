[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-rlnet"
version = "0.1.0"
description = "Safe reinforcement learning for 3D attitude control of a morphing wing aircraft"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Igli"}]
dependencies = [
  "gymnasium==1.2.3",
  "stable-baselines3[extra]==2.8.0",
  "numpy==2.4.4",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "black==25.9.0",
  "flake8==7.3.0",
  "mypy==1.18.2",
]

[tool.setuptools]
packages = ["drone_rlnet"]
